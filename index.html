<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Multiview — tối đa 4 video</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f0f0f;color:#eee}
header{padding:16px 20px;border-bottom:1px solid #292929;background:#181818}
h1{margin:0 0 12px;font-size:20px}.controls{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:8px;max-width:1500px}
input,select,button{font:inherit;border-radius:6px;border:1px solid #444}
input{width:100%;padding:10px;background:#101010;color:#fff}button,select{padding:9px 12px;background:#252525;color:#fff;cursor:pointer}
button:hover{background:#333}.primary{background:#cc0000;border-color:#cc0000}.primary:hover{background:#e00000}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.hint{color:#aaa;font-size:13px;margin-top:8px}
#grid{padding:12px;display:grid;gap:10px;height:calc(100vh - 150px);grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{position:relative;background:#000;border:1px solid #292929;border-radius:8px;overflow:hidden;min-height:0}
.slot.empty{display:grid;place-items:center;color:#666;font-size:15px}iframe{width:100%;height:100%;border:0;display:block}
.remove{position:absolute;z-index:2;right:6px;top:6px;padding:4px 8px;background:rgba(0,0,0,.75);border-color:#555}
@media(max-width:800px){.controls{grid-template-columns:1fr}#grid{height:auto;min-height:calc(100vh - 250px);grid-template-columns:1fr}.slot{aspect-ratio:16/9}}
</style>
</head>
<body>
<header>
<h1>YouTube Multiview — tối đa 4 video</h1>
<div class="controls">
<input id="url1" placeholder="Video 1 — dán link YouTube">
<input id="url2" placeholder="Video 2 — dán link YouTube">
<input id="url3" placeholder="Video 3 — dán link YouTube">
<input id="url4" placeholder="Video 4 — dán link YouTube">
</div>
<div class="row">
<label>Số khung:
<select id="count"><option>1</option><option>2</option><option>3</option><option selected>4</option></select>
</label>
<button class="primary" id="load">Tải Multiview</button>
<button id="clear">Xóa tất cả</button>
<button id="muteAll">Tắt tiếng tất cả</button>
</div>
<div class="hint">Bản này phải được mở qua http://localhost:8765/ — không mở trực tiếp bằng file:/// vì YouTube yêu cầu HTTP Referer cho embedded player. Hỗ trợ watch, youtu.be, live và shorts.</div>
</header>
<main id="grid"></main>
<script>
(function(){
const grid=document.getElementById('grid'),count=document.getElementById('count');
function getVideoId(value){
 if(!value)return null; value=value.trim();
 if(/^[A-Za-z0-9_-]{11}$/.test(value))return value;
 try{
  const u=new URL(value);
  if(u.hostname==='youtu.be'||u.hostname.endsWith('.youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||null;
  if(u.hostname.includes('youtube.com')){
   if(u.searchParams.get('v'))return u.searchParams.get('v');
   const p=u.pathname.split('/').filter(Boolean),i=p.findIndex(x=>['embed','shorts','live'].includes(x));
   if(i>=0&&p[i+1])return p[i+1];
  }
 }catch(e){}
 return null;
}
function render(){
 const n=Number(count.value);grid.innerHTML='';
 grid.style.gridTemplateColumns=n===1?'1fr':'repeat(2,minmax(0,1fr))';
 for(let i=1;i<=n;i++){
  const slot=document.createElement('section');slot.className='slot';
  const id=getVideoId(document.getElementById('url'+i).value);
  if(!id){slot.classList.add('empty');slot.textContent='Khung '+i+' — chưa có video';}
  else{
   const iframe=document.createElement('iframe');
   const origin=location.origin;
   iframe.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1&enablejsapi=1&origin='+encodeURIComponent(origin);
   iframe.referrerPolicy='strict-origin-when-cross-origin';
   iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
   iframe.allowFullscreen=true;
   const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.title='Xóa video này';
   remove.onclick=()=>{document.getElementById('url'+i).value='';render()};
   slot.append(iframe,remove);
  }
  grid.appendChild(slot);
 }
}
document.getElementById('load').onclick=render;
document.getElementById('clear').onclick=()=>{for(let i=1;i<=4;i++)document.getElementById('url'+i).value='';render()};
document.getElementById('muteAll').onclick=()=>grid.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage(JSON.stringify({event:'command',func:'mute',args:[]}), '*'));
count.onchange=render;
for(let i=1;i<=4;i++)document.getElementById('url'+i).addEventListener('keydown',e=>{if(e.key==='Enter')render()});
render();
})();
</script>
</body>
</html>
