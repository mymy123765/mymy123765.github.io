<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#05060b">
  <meta name="description" content="Xem đồng thời tối đa 4 video hoặc livestream YouTube trên cùng một màn hình với giao diện trực quan và phím tắt tiện lợi.">

  <!-- Open Graph / SEO -->
  <meta property="og:title" content="YouTube Multiview — tối đa 4 video">
  <meta property="og:description" content="Xem đồng thời tối đa 4 video hoặc livestream YouTube trên cùng một màn hình.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mymy123765.github.io/">

  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="site.webmanifest">

  <title>YouTube Multiview — tối đa 4 video</title>

  <style>
    :root {
      color-scheme: dark;
      --bg-page: #05060b;
      --bg-panel: #03050a;
      --bg-panel-selected: #10132a;
      --bg-control: #080a18;
      --bg-control-active: #14193d;
      --border-panel: #293951;
      --border-btn: #22265c;
      --border-active: #3b5cb8;
      --text-primary: #d6d7e0;
      --text-secondary: #7598c9;
      --panel-radius: 8px;
      --panel-gap: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       TOOLBAR
       ========================================================= */

    .multiview-toolbar {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 14px 16px 10px;
      padding-top: max(14px, env(safe-area-inset-top));
      z-index: 20;
      user-select: none;
    }

    .control-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .control-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    .segmented-control {
      display: inline-flex;
      align-items: center;
      background: var(--bg-control);
      border: 1px solid var(--border-btn);
      border-radius: 6px;
      padding: 2px;
      gap: 1px;
    }

    .btn-segmented {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 3px 10px;
      height: 26px;
      min-width: 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn-segmented:hover:not(.active) {
      color: #a4c2ee;
      background: #0d122b;
    }

    .btn-segmented.active {
      background: var(--bg-control-active);
      border-color: var(--border-active);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 0 4px rgba(59, 92, 184, 0.4);
    }

    .btn-segmented:focus-visible {
      outline: 2px solid var(--border-active);
      outline-offset: 1px;
    }

    .layout-icon {
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    /* =========================================================
       WORKSPACE & MULTIVIEW GRID
       ========================================================= */

    .multiview-workspace {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      gap: var(--panel-gap);
      padding: 2px 12px 12px 12px;
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    /* Layout: Streams = 2, Equal (Image 1) */
    .multiview-workspace.streams-2.layout-equal {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
    }
    .multiview-workspace.streams-2.layout-equal .stream-panel[data-slot="1"] {
      grid-column: 1;
      grid-row: 1;
    }
    .multiview-workspace.streams-2.layout-equal .stream-panel[data-slot="2"] {
      grid-column: 2;
      grid-row: 1;
    }

    /* Layout: Streams = 2, Main */
    .multiview-workspace.streams-2.layout-main {
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
    }
    .multiview-workspace.streams-2.layout-main .stream-panel[data-slot="1"] {
      grid-column: 1;
      grid-row: 1;
    }
    .multiview-workspace.streams-2.layout-main .stream-panel[data-slot="2"] {
      grid-column: 2;
      grid-row: 1;
    }

    /* Layout: Streams = 3, Equal (Image 3: 2 on top, 1 centered below with equal width) */
    .multiview-workspace.streams-3.layout-equal {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }
    .multiview-workspace.streams-3.layout-equal .stream-panel[data-slot="1"] {
      grid-column: 1 / 3;
      grid-row: 1;
    }
    .multiview-workspace.streams-3.layout-equal .stream-panel[data-slot="2"] {
      grid-column: 3 / 5;
      grid-row: 1;
    }
    .multiview-workspace.streams-3.layout-equal .stream-panel[data-slot="3"] {
      grid-column: 2 / 4;
      grid-row: 2;
    }

    /* Layout: Streams = 3, Main (Image 2: 1 left dominant, 2 stacked right) */
    .multiview-workspace.streams-3.layout-main {
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }
    .multiview-workspace.streams-3.layout-main .stream-panel[data-slot="1"] {
      grid-column: 1;
      grid-row: 1 / 3;
    }
    .multiview-workspace.streams-3.layout-main .stream-panel[data-slot="2"] {
      grid-column: 2;
      grid-row: 1;
    }
    .multiview-workspace.streams-3.layout-main .stream-panel[data-slot="3"] {
      grid-column: 2;
      grid-row: 2;
    }

    /* Layout: Streams = 4, Equal (Image 4: 2x2 grid) */
    .multiview-workspace.streams-4.layout-equal {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }
    .multiview-workspace.streams-4.layout-equal .stream-panel[data-slot="1"] {
      grid-column: 1;
      grid-row: 1;
    }
    .multiview-workspace.streams-4.layout-equal .stream-panel[data-slot="2"] {
      grid-column: 2;
      grid-row: 1;
    }
    .multiview-workspace.streams-4.layout-equal .stream-panel[data-slot="3"] {
      grid-column: 1;
      grid-row: 2;
    }
    .multiview-workspace.streams-4.layout-equal .stream-panel[data-slot="4"] {
      grid-column: 2;
      grid-row: 2;
    }

    /* Layout: Streams = 4, Main (Image 5: 1 left dominant, 3 stacked right) */
    .multiview-workspace.streams-4.layout-main {
      grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    .multiview-workspace.streams-4.layout-main .stream-panel[data-slot="1"] {
      grid-column: 1;
      grid-row: 1 / 4;
    }
    .multiview-workspace.streams-4.layout-main .stream-panel[data-slot="2"] {
      grid-column: 2;
      grid-row: 1;
    }
    .multiview-workspace.streams-4.layout-main .stream-panel[data-slot="3"] {
      grid-column: 2;
      grid-row: 2;
    }
    .multiview-workspace.streams-4.layout-main .stream-panel[data-slot="4"] {
      grid-column: 2;
      grid-row: 3;
    }

    /* =========================================================
       STREAM PANEL COMPONENT
       ========================================================= */

    .stream-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-panel);
      border: 1.5px dashed var(--border-panel);
      border-radius: var(--panel-radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }

    .stream-panel.is-empty {
      cursor: pointer;
    }

    .stream-panel.is-empty:hover {
      border-color: #3b5cb8;
    }

    .stream-panel.is-empty:focus-visible {
      outline: 2px solid var(--border-active);
      outline-offset: 1px;
    }

    .stream-panel.is-active {
      background-color: var(--bg-panel-selected);
    }

    /* Empty panel internal content */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .empty-state .plus-icon {
      width: 38px;
      height: 38px;
      color: var(--text-primary);
      stroke: var(--text-primary);
    }

    .empty-state .add-stream-label {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 18px;
      letter-spacing: 0.2px;
    }

    /* Configured stream iframe */
    .stream-panel.has-video {
      border-style: solid;
      border-color: #1a2233;
      background: #000;
    }

    .stream-panel iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    /* Remove button */
    .btn-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      background: rgba(3, 5, 10, 0.75);
      border: 1px solid var(--border-panel);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .stream-panel:hover .btn-remove,
    .btn-remove:focus-visible {
      opacity: 1;
    }

    .btn-remove:hover {
      background: #cc2424;
      border-color: #cc2424;
      color: #ffffff;
    }

    .btn-remove:focus-visible {
      outline: 2px solid var(--border-active);
      outline-offset: 1px;
    }

    /* =========================================================
       ADD STREAM MODAL
       ========================================================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 10, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .modal-card {
      background: #090d1f;
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      width: min(440px, 94vw);
      padding: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      animation: modalFadeIn 0.15s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .modal-label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .modal-input {
      width: 100%;
      background: #04060d;
      border: 1px solid var(--border-panel);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .modal-input::placeholder {
      color: #4a5c7a;
    }

    .modal-input:focus {
      border-color: var(--border-active);
      box-shadow: 0 0 0 2px rgba(59, 92, 184, 0.3);
    }

    .modal-hint {
      font-size: 12px;
      color: #556c8e;
      margin-top: 8px;
      line-height: 1.4;
    }

    /* Link type toggle inside modal */
    .link-type-group {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .link-type-group input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .link-type-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 5px;
      border: 1px solid var(--border-btn);
      background: var(--bg-control);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
    }

    .link-type-label:hover {
      border-color: #3b5cb8;
      color: #a4c2ee;
    }

    .link-type-group input[type="radio"]:checked + .link-type-label {
      background: var(--bg-control-active);
      border-color: var(--border-active);
      color: #ffffff;
      box-shadow: 0 0 4px rgba(59,92,184,0.4);
    }

    .link-type-icon {
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-modal {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-cancel {
      background: #0f142b;
      border: 1px solid var(--border-btn);
      color: var(--text-secondary);
    }

    .btn-cancel:hover {
      background: #141a38;
      color: #9cbde8;
    }

    .btn-submit {
      background: #182352;
      border: 1px solid var(--border-active);
      color: #ffffff;
    }

    .btn-submit:hover {
      background: #202e6e;
    }

    /* Modal error message */
    .modal-error {
      font-size: 12px;
      color: #e05c5c;
      margin-top: 6px;
      min-height: 16px;
      line-height: 1.4;
      display: none;
    }

    .modal-error.visible {
      display: block;
    }

    /* =========================================================
       FULLSCREEN UI
       ========================================================= */

    .btn-exit-fullscreen {
      position: fixed;
      z-index: 100;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: none;
      padding: 8px 14px;
      background: rgba(9, 13, 31, 0.85);
      border: 1px solid var(--border-panel);
      border-radius: 6px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .btn-exit-fullscreen:hover {
      background: rgba(18, 25, 60, 0.95);
      color: var(--text-primary);
    }

    body.is-fullscreen .multiview-toolbar {
      display: none;
    }

    body.is-fullscreen .multiview-workspace {
      padding: 4px;
      gap: 6px;
    }

    body.is-fullscreen .btn-exit-fullscreen {
      display: block;
    }

    /* =========================================================
       MOBILE & RESPONSIVE ADJUSTMENTS
       ========================================================= */

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
        height: auto;
        min-height: 100dvh;
      }

      .multiview-toolbar {
        flex-wrap: wrap;
        gap: 12px;
        padding: 10px 8px;
      }

      .multiview-workspace {
        display: flex;
        flex-direction: column;
        height: auto;
        padding: 8px;
        gap: 8px;
        overflow: visible;
      }

      .stream-panel {
        aspect-ratio: 16 / 9;
        min-height: 200px;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- TOOLBAR -->
  <header id="toolbar" class="multiview-toolbar" role="toolbar" aria-label="Multiview Toolbar">
    <!-- Stream Count Selector -->
    <div class="control-group" id="streamCountGroup">
      <span class="control-label" id="streamsLabel">Streams</span>
      <div class="segmented-control" role="group" aria-labelledby="streamsLabel">
        <button type="button" class="btn-segmented" data-count="2" aria-pressed="false">2</button>
        <button type="button" class="btn-segmented" data-count="3" aria-pressed="false">3</button>
        <button type="button" class="btn-segmented" data-count="4" aria-pressed="false">4</button>
      </div>
    </div>

    <!-- Layout Selector -->
    <div class="control-group" id="layoutGroup">
      <span class="control-label" id="layoutLabel">Layout</span>
      <div class="segmented-control" role="group" aria-labelledby="layoutLabel">
        <button type="button" class="btn-segmented" data-layout="equal" aria-pressed="false">
          <svg class="layout-icon" width="13" height="13" viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
            <rect x="1" y="1" width="5.2" height="5.2" rx="0.8"/>
            <rect x="7.8" y="1" width="5.2" height="5.2" rx="0.8"/>
            <rect x="1" y="7.8" width="5.2" height="5.2" rx="0.8"/>
            <rect x="7.8" y="7.8" width="5.2" height="5.2" rx="0.8"/>
          </svg>
          <span>Equal</span>
        </button>
        <button type="button" class="btn-segmented" data-layout="main" aria-pressed="false">
          <svg class="layout-icon" width="13" height="13" viewBox="0 0 14 14" aria-hidden="true" fill="currentColor">
            <rect x="1" y="1" width="6.6" height="12" rx="0.8"/>
            <rect x="8.8" y="1" width="4.2" height="5.2" rx="0.8"/>
            <rect x="8.8" y="7.8" width="4.2" height="5.2" rx="0.8"/>
          </svg>
          <span>Main</span>
        </button>
      </div>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main id="workspace" class="multiview-workspace" aria-label="Multiview Workspace"></main>

  <!-- ADD STREAM MODAL -->
  <div id="addStreamModal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Add Stream</h2>
        <button type="button" class="modal-close" id="modalCloseBtn" aria-label="Đóng hộp thoại">×</button>
      </div>
      <form id="addStreamForm" class="modal-form">
        <!-- Link Type Selector -->
        <div class="link-type-group" role="group" aria-label="Loại link">
          <input type="radio" name="linkType" id="typeYoutube" value="youtube" checked>
          <label for="typeYoutube" class="link-type-label">
            <span class="link-type-icon">▶</span> YouTube
          </label>
          <input type="radio" name="linkType" id="typeDirect" value="direct">
          <label for="typeDirect" class="link-type-label">
            <span class="link-type-icon">🔗</span> Direct Stream
          </label>
        </div>

        <label for="streamUrlInput" class="modal-label" id="streamUrlLabel">YouTube Video URL hoặc Video ID</label>
        <input
          type="text"
          id="streamUrlInput"
          class="modal-input"
          placeholder="https://www.youtube.com/watch?v=... hoặc ID video"
          autocomplete="off"
          spellcheck="false"
        >
        <p class="modal-hint" id="streamUrlHint">Hỗ trợ link watch, youtu.be, live, shorts, embed và ID video 11 ký tự.</p>
        <p class="modal-error" id="streamUrlError" role="alert" aria-live="polite"></p>
        <div class="modal-actions">
          <button type="button" class="btn-modal btn-cancel" id="modalCancelBtn">Hủy</button>
          <button type="submit" class="btn-modal btn-submit" id="modalSubmitBtn">Add Stream</button>
        </div>
      </form>
    </div>
  </div>

  <!-- EXIT FULLSCREEN BUTTON -->
  <button id="exitFullscreen" type="button" class="btn-exit-fullscreen" aria-label="Thoát toàn màn hình">
    Thoát toàn màn hình
  </button>

  <script>
    (() => {
      'use strict';

      const YOUTUBE_ORIGIN = 'https://www.youtube.com';
      const MAX_SLOTS = 4;
      const STORAGE_KEY = 'multiview_state_v2';

      // -------------------------------------------------------
      // State  (streams entries: { type: 'youtube'|'direct', src: string })
      // -------------------------------------------------------
      let streamCount = 2;
      let layoutMode  = 'equal';
      let streams     = Array(MAX_SLOTS).fill(null);  // null | { type, src }
      let activeSlot  = null;
      let allMuted    = true;

      // -------------------------------------------------------
      // DOM Elements
      // -------------------------------------------------------
      const workspace          = document.getElementById('workspace');
      const layoutGroup        = document.getElementById('layoutGroup');
      const streamCountButtons = document.querySelectorAll('#streamCountGroup button[data-count]');
      const layoutButtons      = document.querySelectorAll('#layoutGroup button[data-layout]');

      const modal          = document.getElementById('addStreamModal');
      const modalTitle     = document.getElementById('modalTitle');
      const modalForm      = document.getElementById('addStreamForm');
      const modalInput     = document.getElementById('streamUrlInput');
      const modalLabel     = document.getElementById('streamUrlLabel');
      const modalHint      = document.getElementById('streamUrlHint');
      const modalError     = document.getElementById('streamUrlError');
      const modalCloseBtn  = document.getElementById('modalCloseBtn');
      const modalCancelBtn = document.getElementById('modalCancelBtn');
      const exitFullscreenBtn = document.getElementById('exitFullscreen');

      const radioYoutube = document.getElementById('typeYoutube');
      const radioDirect  = document.getElementById('typeDirect');

      // -------------------------------------------------------
      // LocalStorage persistence
      // -------------------------------------------------------
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ streamCount, layoutMode, streams }));
        } catch (_) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const s = JSON.parse(raw);
          if (typeof s.streamCount === 'number' && s.streamCount >= 2 && s.streamCount <= 4) {
            streamCount = s.streamCount;
          }
          if (s.layoutMode === 'equal' || s.layoutMode === 'main') {
            layoutMode = s.layoutMode;
          }
          if (Array.isArray(s.streams)) {
            for (let i = 0; i < MAX_SLOTS; i++) {
              const entry = s.streams[i];
              if (entry && (entry.type === 'youtube' || entry.type === 'direct') && typeof entry.src === 'string') {
                streams[i] = { type: entry.type, src: entry.src };
              } else {
                streams[i] = null;
              }
            }
          }
        } catch (_) {}
      }

      // -------------------------------------------------------
      // YouTube ID helpers
      // -------------------------------------------------------
      function isValidVideoId(id) {
        return typeof id === 'string' && /^[A-Za-z0-9_-]{11}$/.test(id);
      }

      function getVideoId(value) {
        if (!value) return null;
        value = value.trim();
        if (isValidVideoId(value)) return value;
        try {
          const url = new URL(value);
          const hostname = url.hostname.toLowerCase();
          if (hostname === 'youtu.be' || hostname.endsWith('.youtu.be')) {
            const id = url.pathname.split('/').filter(Boolean)[0];
            return isValidVideoId(id) ? id : null;
          }
          if (hostname === 'youtube.com' || hostname.endsWith('.youtube.com')) {
            const watchId = url.searchParams.get('v');
            if (watchId && isValidVideoId(watchId)) return watchId;
            const parts = url.pathname.split('/').filter(Boolean);
            const supportedTypes = ['embed', 'shorts', 'live'];
            const typeIndex = parts.findIndex(p => supportedTypes.includes(p.toLowerCase()));
            if (typeIndex >= 0 && parts[typeIndex + 1]) {
              const id = parts[typeIndex + 1];
              return isValidVideoId(id) ? id : null;
            }
          }
        } catch { return null; }
        return null;
      }

      // -------------------------------------------------------
      // Direct stream URL validation
      // -------------------------------------------------------
      function isValidDirectUrl(value) {
        if (!value) return false;
        value = value.trim();
        try {
          const url = new URL(value);
          return url.protocol === 'http:' || url.protocol === 'https:';
        } catch { return false; }
      }

      // -------------------------------------------------------
      // Duplicate detection
      // -------------------------------------------------------
      function findDuplicateSlot(type, src, excludeSlot) {
        for (let i = 0; i < MAX_SLOTS; i++) {
          if (i + 1 === excludeSlot) continue;
          const s = streams[i];
          if (s && s.type === type && s.src === src) return i + 1;
        }
        return null;
      }

      // -------------------------------------------------------
      // postMessage helper for YouTube iframes
      // -------------------------------------------------------
      function sendYouTubeCommand(iframe, func) {
        if (!iframe || !iframe.contentWindow) return;
        iframe.contentWindow.postMessage(
          JSON.stringify({ event: 'command', func, args: [] }),
          YOUTUBE_ORIGIN
        );
      }

      // -------------------------------------------------------
      // Modal UI helpers
      // -------------------------------------------------------
      function getLinkType() {
        return radioDirect.checked ? 'direct' : 'youtube';
      }

      function setLinkType(type) {
        if (type === 'direct') {
          radioDirect.checked = true;
        } else {
          radioYoutube.checked = true;
        }
        updateModalUI();
      }

      function updateModalUI() {
        const isDirect = getLinkType() === 'direct';
        if (isDirect) {
          modalLabel.textContent = 'Direct Stream URL';
          modalInput.placeholder = 'https://example.com/stream.m3u8 hoặc .mp4, .webm...';
          modalHint.textContent  = 'Dán trực tiếp link stream mà bạn có thể mở thẳng trên trình duyệt.';
        } else {
          modalLabel.textContent = 'YouTube Video URL hoặc Video ID';
          modalInput.placeholder = 'https://www.youtube.com/watch?v=... hoặc ID video';
          modalHint.textContent  = 'Hỗ trợ link watch, youtu.be, live, shorts, embed và ID video 11 ký tự.';
        }
        clearModalError();
      }

      function showModalError(msg) {
        modalError.textContent = msg;
        modalError.classList.add('visible');
        modalInput.focus();
      }

      function clearModalError() {
        modalError.textContent = '';
        modalError.classList.remove('visible');
      }

      // -------------------------------------------------------
      // Open / Close modal
      // -------------------------------------------------------
      function openAddStreamModal(slotNum) {
        activeSlot = slotNum;
        modalTitle.textContent = `Add Stream — Slot ${slotNum}`;

        // Restore previous entry for this slot if any
        const existing = streams[slotNum - 1];
        if (existing) {
          setLinkType(existing.type);
          modalInput.value = existing.type === 'youtube' ? existing.src : existing.src;
        } else {
          setLinkType('youtube');
          modalInput.value = '';
        }
        clearModalError();
        modal.hidden = false;
        renderActivePanelHighlight();
        setTimeout(() => { modalInput.focus(); modalInput.select(); }, 50);
      }

      function closeAddStreamModal() {
        modal.hidden = true;
        clearModalError();
        renderActivePanelHighlight();
      }

      // -------------------------------------------------------
      // Save stream from modal
      // -------------------------------------------------------
      function saveStreamFromModal(e) {
        e.preventDefault();
        clearModalError();
        const rawValue = modalInput.value.trim();
        const type     = getLinkType();

        if (!rawValue) {
          showModalError('Vui lòng nhập link hoặc ID video.');
          return;
        }

        let src = null;

        if (type === 'youtube') {
          const videoId = getVideoId(rawValue);
          if (!videoId) {
            showModalError('Không tìm thấy Video ID YouTube hợp lệ. Vui lòng kiểm tra lại đường dẫn.');
            return;
          }
          src = videoId;
        } else {
          if (!isValidDirectUrl(rawValue)) {
            showModalError('URL không hợp lệ. Vui lòng nhập đường dẫn HTTP/HTTPS đầy đủ.');
            return;
          }
          src = rawValue;
        }

        // Duplicate check
        const dupSlot = findDuplicateSlot(type, src, activeSlot);
        if (dupSlot !== null) {
          showModalError(`Link này đã được sử dụng ở Slot ${dupSlot}. Vui lòng chọn link khác.`);
          return;
        }

        streams[activeSlot - 1] = { type, src };
        saveState();
        closeAddStreamModal();
        render();
      }

      // -------------------------------------------------------
      // Remove stream (triggered by X button — full clear)
      // -------------------------------------------------------
      function removeStream(slotNum) {
        streams[slotNum - 1] = null;
        if (activeSlot === slotNum) activeSlot = null;
        saveState();
        render();
      }

      // -------------------------------------------------------
      // Render helpers
      // -------------------------------------------------------
      function renderActivePanelHighlight() {
        workspace.querySelectorAll('.stream-panel').forEach(panel => {
          const slotNum = Number(panel.getAttribute('data-slot'));
          panel.classList.toggle('is-active', slotNum === activeSlot);
        });
      }

      function updateToolbarUI() {
        streamCountButtons.forEach(btn => {
          const count = Number(btn.getAttribute('data-count'));
          const isActive = count === streamCount;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-pressed', String(isActive));
        });

        layoutGroup.style.display = streamCount === 2 ? 'none' : 'inline-flex';

        layoutButtons.forEach(btn => {
          const layout = btn.getAttribute('data-layout');
          const isActive = layout === layoutMode;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-pressed', String(isActive));
        });
      }

      /**
       * Build an iframe for either YouTube or direct stream.
       */
      function buildIframe(entry, slotIndex) {
        const iframe = document.createElement('iframe');
        iframe.dataset.videoId = entry.src;
        iframe.dataset.type    = entry.type;
        iframe.referrerPolicy  = 'strict-origin-when-cross-origin';
        iframe.allowFullscreen = true;
        iframe.loading         = 'eager';
        iframe.title           = `Stream ${slotIndex + 1}`;

        if (entry.type === 'youtube') {
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          const params = new URLSearchParams({
            autoplay: '1',
            mute: allMuted ? '1' : '0',
            rel: '0',
            playsinline: '1'
          });
          const isWebOrigin = window.location.origin && window.location.origin.startsWith('http');
          if (isWebOrigin) {
            params.set('enablejsapi', '1');
            params.set('origin', window.location.origin);
          }
          iframe.src = `${YOUTUBE_ORIGIN}/embed/${encodeURIComponent(entry.src)}?${params.toString()}`;
        } else {
          // Direct stream — embed via native <video> in srcdoc for best compatibility
          iframe.allow = 'autoplay; fullscreen';
          const safeUrl = entry.src.replace(/'/g, '%27');
          iframe.srcdoc = [
            '<!doctype html><html><head>',
            '<meta name="viewport" content="width=device-width,initial-scale=1">',
            '<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:#000}',
            'video{width:100%;height:100%;object-fit:contain;display:block}</style></head><body>',
            `<video src='${safeUrl}' autoplay muted playsinline controls></video>`,
            '</body></html>'
          ].join('');
        }

        return iframe;
      }

      /**
       * Render Multiview workspace panels and layout classes.
       */
      function render() {
        updateToolbarUI();

        const effectiveLayout = streamCount === 2 ? 'equal' : layoutMode;
        workspace.className   = `multiview-workspace streams-${streamCount} layout-${effectiveLayout}`;

        // Preserve existing iframes to avoid reloads
        const existingIframes = {};
        workspace.querySelectorAll('.stream-panel.has-video').forEach(panel => {
          const slot   = panel.getAttribute('data-slot');
          const iframe = panel.querySelector('iframe');
          if (slot && iframe) existingIframes[slot] = iframe;
        });

        workspace.innerHTML = '';

        for (let i = 1; i <= streamCount; i++) {
          const slotIndex = i - 1;
          const entry     = streams[slotIndex]; // null | { type, src }

          const panel = document.createElement('section');
          panel.className = 'stream-panel';
          panel.setAttribute('data-slot', String(i));
          if (i === activeSlot) panel.classList.add('is-active');

          if (entry) {
            panel.classList.add('has-video');

            let iframe = existingIframes[String(i)];
            if (!iframe || iframe.dataset.videoId !== entry.src || iframe.dataset.type !== entry.type) {
              iframe = buildIframe(entry, slotIndex);
            }

            const removeBtn = document.createElement('button');
            removeBtn.type      = 'button';
            removeBtn.className = 'btn-remove';
            removeBtn.setAttribute('aria-label', `Remove stream ${i}`);
            removeBtn.title     = `Xóa video khỏi Slot ${i}`;
            removeBtn.textContent = '×';
            removeBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              removeStream(i);
            });

            panel.appendChild(iframe);
            panel.appendChild(removeBtn);
          } else {
            panel.classList.add('is-empty');
            panel.setAttribute('tabindex', '0');
            panel.setAttribute('role', 'button');
            panel.setAttribute('aria-label', `Slot ${i}: Add Stream`);
            panel.innerHTML = `
              <div class="empty-state">
                <svg class="plus-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span class="add-stream-label">Add Stream</span>
              </div>
            `;
            panel.addEventListener('click', () => openAddStreamModal(i));
            panel.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAddStreamModal(i); }
            });
          }

          workspace.appendChild(panel);
        }
      }

      // -------------------------------------------------------
      // Toggle mute
      // -------------------------------------------------------
      function toggleMuteAll() {
        const iframes = workspace.querySelectorAll('iframe');
        if (!iframes.length) return;
        allMuted = !allMuted;
        iframes.forEach(iframe => {
          if (iframe.dataset.type === 'youtube') {
            sendYouTubeCommand(iframe, allMuted ? 'mute' : 'unMute');
          }
          // Direct stream iframes get muted/unmuted via srcdoc video — limited control;
          // a reload is required for full mute toggling on direct streams.
        });
      }

      // -------------------------------------------------------
      // Fullscreen
      // -------------------------------------------------------
      async function enterFullscreen() {
        try {
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
            else if (workspace.requestFullscreen) await workspace.requestFullscreen();
          }
        } catch (err) { console.warn('Fullscreen error:', err); }
      }

      async function exitFullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
        } catch (err) { console.warn('Exit fullscreen error:', err); }
      }

      function updateFullscreenUI() {
        document.body.classList.toggle('is-fullscreen', Boolean(document.fullscreenElement));
      }

      // -------------------------------------------------------
      // Stream count change with conflict check
      // -------------------------------------------------------
      function tryChangeStreamCount(newCount) {
        if (newCount === streamCount) return;

        // Check how many slots (within new count range) are filled
        // but first, check if slots BEYOND newCount have videos -> warn
        const overflowSlots = [];
        for (let i = newCount; i < streamCount; i++) {
          if (streams[i]) overflowSlots.push(i + 1);
        }

        if (overflowSlots.length > 0) {
          const slotNames = overflowSlots.join(', ');
          const confirmed = window.confirm(
            `Chuyển sang chế độ ${newCount} màn hình sẽ ẩn video ở Slot ${slotNames}.\n` +
            `Các video này sẽ bị xóa khỏi danh sách. Bạn có chắc chắn không?`
          );
          if (!confirmed) return;
          // Clear overflow slots
          for (let i = newCount; i < MAX_SLOTS; i++) {
            streams[i] = null;
          }
        }

        streamCount = newCount;
        saveState();
        render();
      }

      // -------------------------------------------------------
      // Event listeners
      // -------------------------------------------------------

      // Link type radio change → update modal labels
      [radioYoutube, radioDirect].forEach(radio => {
        radio.addEventListener('change', () => updateModalUI());
      });

      // Live validation on input (clear error while typing)
      modalInput.addEventListener('input', clearModalError);

      // Stream count selector
      streamCountButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const count = Number(btn.getAttribute('data-count'));
          if (count) tryChangeStreamCount(count);
        });
      });

      // Layout selector
      layoutButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const layout = btn.getAttribute('data-layout');
          if (layout && layout !== layoutMode) {
            layoutMode = layout;
            saveState();
            render();
          }
        });
      });

      // Modal
      modalForm.addEventListener('submit', saveStreamFromModal);
      modalCloseBtn.addEventListener('click', closeAddStreamModal);
      modalCancelBtn.addEventListener('click', closeAddStreamModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeAddStreamModal(); });

      // Fullscreen
      exitFullscreenBtn.addEventListener('click', exitFullscreen);
      document.addEventListener('fullscreenchange', updateFullscreenUI);

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        const activeTag = document.activeElement?.tagName;
        const isTyping  = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';

        if (e.key === 'Escape') {
          if (!modal.hidden) { closeAddStreamModal(); return; }
          if (document.fullscreenElement) { exitFullscreen(); return; }
        }

        if (isTyping) return;

        const key = e.key.toLowerCase();
        if (key === 'm') toggleMuteAll();
        else if (key === 'f') {
          if (document.fullscreenElement) exitFullscreen();
          else enterFullscreen();
        }
      });

      // -------------------------------------------------------
      // Bootstrap
      // -------------------------------------------------------
      loadState();
      render();
    })();
  </script>
</body>
</html>
